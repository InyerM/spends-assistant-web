<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Anotto · Navegación local</title>
<style>
:root{color-scheme:dark;--bg:#080b0d;--surface:#111619;--border:#2c373b;--ink:#f5f7f6;--muted:#a7b5b0;--brand:#64d59f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);color:var(--ink);background:var(--surface);border-radius:9px;padding:10px 14px;text-align:left}button:hover,button:focus-visible{border-color:var(--brand)}button[aria-pressed=true],.active{background:#163429;color:var(--brand)}header{padding:20px 28px;border-bottom:1px solid var(--border)}header h1{font-size:24px;margin:0 0 14px}header p{color:var(--muted);max-width:75ch}.choices{display:flex;flex-wrap:wrap;gap:8px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:600px;max-width:1500px;margin:auto}.sidebar{padding:24px 18px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:8px}.brand{font-size:27px;font-weight:700;margin-bottom:24px}.brand span{color:var(--brand)}.sidebar button{background:transparent;border-color:transparent}.sidebar button:hover{background:var(--surface)}.sidebar .bottom{margin-top:auto}.workspace{padding:28px 36px;min-width:0}.workspace h2{font-size:27px;margin:0 0 6px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;justify-content:space-between;margin:24px 0}.toolbar input{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:12px;width:min(550px,100%)}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}.groups h3{font-size:17px;margin:0 0 12px}.rows{border:1px solid var(--border);border-radius:12px;overflow:hidden}.row{display:flex;align-items:center;gap:16px;border:0;border-radius:0;padding:16px;width:100%;border-bottom:1px solid var(--border);background:transparent}.row:last-child{border-bottom:0}.row span{flex:1}.row small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.row em{font-style:normal;color:var(--brand)}.favorites{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.sample{border-top:1px solid var(--border);margin-top:32px;padding-top:24px}.hint{color:var(--muted);font-size:13px;max-width:72ch}.drawer{position:fixed;inset:0 0 0 auto;background:var(--surface);width:min(560px,100%);z-index:2;padding:28px;overflow:auto;border-left:1px solid var(--border)}.drawer .groups{grid-template-columns:1fr}.drawer-close{float:right}.hidden{display:none}.crumb{font-size:13px;color:var(--muted);margin-bottom:15px}.tools{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--border);flex-direction:row;flex-wrap:wrap;padding:14px}.brand{width:100%;margin:0}.sidebar .bottom{margin:0}.workspace{padding:24px 18px}.groups{grid-template-columns:1fr}.choices button{font-size:13px}.toolbar{flex-wrap:wrap}header{padding:18px}}
</style>
<header><h1>Navegación de Anotto</h1><div class="choices" id="choices"></div><p id="direction"></p><p class="hint">Propuesta local interactiva. Puedes abrir módulos, buscar y guardar favoritos de ejemplo. No contiene tus datos financieros.</p></header>
<div class="shell"><nav class="sidebar" id="sidebar" aria-label="Principal"></nav><main class="workspace" id="workspace"></main></div><aside class="drawer hidden" id="drawer" aria-label="Todos los módulos"></aside>
<script>
const options=[['Esenciales + módulos','Inicio, Transacciones y Por revisar siempre visibles. El resto vive en un centro de módulos, separado de la configuración de tu cuenta.'],['Esenciales + favoritos','Una barra corta con tus accesos elegidos. Un catálogo con búsqueda para explorar todas las herramientas.'],['Espacios de trabajo','Tres destinos principales: Tu dinero, Por revisar y Planificar. Cada espacio reúne sus herramientas; Configuración conserva sólo ajustes.'],['Más en un panel','Inicio y Transacciones permanecen visibles. Más abre las herramientas por secciones sin abandonar lo que estabas haciendo.'],['Configuración por filas','Los accesos principales se mantienen; un centro con filas separa Herramientas financieras y Ajustes personales. Los módulos nunca se confunden con preferencias.']];
const groups=[['Tu dinero',[['Cuentas','Saldos, tarjetas y cuentas'],['Presupuestos','Límites y seguimiento de gastos'],['Metas de ahorro','Progreso hacia tus objetivos'],['Contactos y comercios','Destinatarios y lugares donde compras'],['Inversiones','Activos y rendimientos'],['Préstamos','Deudas y cuotas'],['Por cobrar','Dinero que te deben'],['Cesantías','Fondos y aportes']]],['Por revisar',[['Correo','Avisos recibidos y pendientes'],['Documentos','Comprobantes y extractos'],['Conciliación','Contrastar movimientos con extractos']]],['Herramientas',[['Asistente IA','Consulta sobre tus movimientos'],['Categorías','Ordena tus ingresos y gastos'],['Automatización','Reglas para sugerir datos'],['Gastos programados','Movimientos con fecha prevista'],['Gastos rápidos','Plantillas para confirmar un gasto habitual']]],['Ajustes personales',[['Perfil y seguridad','Cuenta, sesiones y acceso'],['Idioma y apariencia','Preferencias de la interfaz'],['Notificaciones','Avisos dentro de Anotto'],['Conexiones','Correo e integraciones'],['Plan y uso','Suscripción y consumo'],['Ayuda','Guías y soporte']]]];
let choice=0,page='Inicio',query='',favorites=new Set(['Presupuestos','Correo']);
const $=id=>document.getElementById(id);
function choose(i){choice=i;page='Inicio';$('drawer').classList.add('hidden');render()}
function open(name){page=name;query='';$('drawer').classList.add('hidden');render()}
function rows(group,search=''){return group[1].filter(([name,hint])=>(name+' '+hint).toLowerCase().includes(search.toLowerCase())).map(([name,hint])=>`<div style="display:flex"><button class="row" onclick="open('${name}')"><span>${name}<small>${hint}</small></span><em>›</em></button>${choice===1?`<button aria-label="Favorito ${name}" onclick="pin('${name}')">${favorites.has(name)?'Quitar':'Fijar'}</button>`:''}</div>`).join('')}
function catalog(filter=''){return `<div class="groups">${groups.map(group=>{const content=rows(group,filter);return content?`<section><h3>${group[0]}</h3><div class="rows">${content}</div></section>`:''}).join('')}</div>`}
function pin(name){favorites.has(name)?favorites.delete(name):favorites.add(name);render()}
function showDrawer(){ $('drawer').innerHTML=`<button class="drawer-close" onclick="document.getElementById('drawer').classList.add('hidden')">Cerrar</button><h2>Más herramientas</h2><p class="muted">Todo Anotto, organizado por lo que quieres hacer.</p>${catalog()}`;$('drawer').classList.remove('hidden') }
function search(value){$('catalog').innerHTML=catalog(value)}
function render(){
 $('choices').innerHTML=options.map((o,i)=>`<button aria-pressed="${i===choice}" onclick="choose(${i})">${o[0]}</button>`).join('');$('direction').textContent=options[choice][1];
 const nav=choice===2?['Inicio','Tu dinero','Por revisar','Planificar','Asistente IA']:choice===3?['Inicio','Transacciones','Por revisar','Más']:choice===4?['Inicio','Transacciones','Por revisar','Centro de herramientas']:choice===1?['Inicio','Transacciones',...favorites,'Todos los módulos']:['Inicio','Transacciones','Por revisar','Módulos'];
 $('sidebar').innerHTML=`<div class="brand">anotto<span>.</span></div>${nav.map(name=>`<button class="${page===name?'active':''}" onclick="${name==='Más'?'showDrawer()':`open('${name}')`}">${name}</button>`).join('')}<button class="bottom" onclick="open('Configuración')">Configuración</button>`;
 const isCatalog=['Módulos','Todos los módulos','Centro de herramientas','Configuración'].includes(page);
 const area=choice===2&&['Tu dinero','Por revisar','Planificar'].includes(page);
 let body=isCatalog?`<div class="toolbar"><input placeholder="Buscar módulo o ajuste" aria-label="Buscar módulo" oninput="search(this.value)"></div><div id="catalog">${page==='Configuración'&&choice!==4?`<div class="rows">${rows(groups[3])}</div>`:catalog()}</div>`:area?`<div class="toolbar"><span class="muted">Herramientas de este espacio</span></div><div class="rows">${rows(groups[page==='Tu dinero'?0:page==='Por revisar'?1:2])}</div>`:`<p class="muted">${page==='Inicio'?'Lo importante de tu dinero, en un solo lugar.':'Vista de ejemplo del módulo seleccionado.'}</p><div class="tools"><button onclick="open('Transacciones')">Registrar movimiento</button><button onclick="open('Presupuestos')">Ver presupuestos</button><button onclick="${choice===3?'showDrawer()':`open('${choice===4?'Centro de herramientas':'Módulos'}')`}">Explorar herramientas</button></div><div class="sample"><h3>Tu información principal</h3><p class="muted">Resumen, alertas y movimientos recientes. Los módulos secundarios aparecen cuando los necesitas.</p></div>`;
 if(choice===1&&page==='Inicio')body=`<div class="favorites">${[...favorites].map(name=>`<button onclick="open('${name}')">${name}</button>`).join('')}</div>`+body;
 $('workspace').innerHTML=`<p class="crumb">Anotto / ${page}</p><h2>${page}</h2>${body}`;
}
render();
</script></html>
